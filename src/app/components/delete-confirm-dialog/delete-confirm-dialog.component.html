<h2 mat-dialog-title class="text">Confirm Delete</h2>
<mat-dialog-content>
  Do you really want to delete this record?
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close (click)="onCancel()" class="cancel-button">No</button>
  <button mat-button color="warn" mat-dialog-close cdkFocusInitial (click)="onConfirm()" class="confirm-button">Yes</button>
</mat-dialog-actions>
